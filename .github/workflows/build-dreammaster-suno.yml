name: Build DreamMaster Suno Presets
on:
  push:
    branches: ['codex/dreammaster-suno-presets']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: DreamMaster
            source: DreamMaster
            version: 0.2.1
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify and reassemble original artwork
        run: python Artwork/prepare-artwork.py
      - name: Configure
        run: cmake -S '${{ matrix.source }}' -B build -G 'Visual Studio 17 2022' -A x64
      - name: Compile plug-in and editor checks
        run: cmake --build build --config Release --target ${{ matrix.product }}_VST3 ${{ matrix.product }}Preview --parallel 2
      - name: Check controls and render editor
        run: |
          New-Item -ItemType Directory validation -Force | Out-Null
          & './build/${{ matrix.product }}Preview_artefacts/Release/${{ matrix.product }}Preview.exe' 'validation/${{ matrix.product }}.png' 2>&1 | Tee-Object validation/editor-checks.txt
          if ($LASTEXITCODE -ne 0) { throw 'Editor checks failed' }
      - name: Mastering DSP regression
        if: matrix.product == 'DreamMaster'
        run: |
          cmake --build build --config Release --target DreamMasterTests --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Test compilation failed' }
          & ./build/Release/DreamMasterTests.exe 2>&1 | Tee-Object validation/dsp-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'DSP tests failed' }
      - name: Validate VST3
        run: |
          Invoke-WebRequest 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip' -OutFile pluginval.zip
          if ((Get-FileHash pluginval.zip -Algorithm SHA256).Hash -ne 'C08E61CE3B96DB41636F8EC7E76F4C7E2C13EBDAC7FA1B5A1F52B4F32EC715AB') { throw 'pluginval checksum mismatch' }
          Expand-Archive pluginval.zip pluginval
          $exe = (Get-ChildItem pluginval -Recurse -Filter pluginval.exe | Select-Object -First 1).FullName
          $bundle = (Resolve-Path 'build/${{ matrix.product }}_artefacts/Release/VST3/${{ matrix.product }}.vst3').Path
          & $exe --strictness-level 5 --repeat 3 --random-seed 12345 --timeout-ms 60000 --validate $bundle 2>&1 | Tee-Object validation/pluginval.txt
          if ($LASTEXITCODE -ne 0) { throw 'pluginval failed' }
          $log = Get-Content validation/pluginval.txt -Raw
          if ($log -notmatch '(?m)^SUCCESS\r?$') { throw 'Missing SUCCESS' }
      - name: Package
        run: |
          New-Item -ItemType Directory staging -Force | Out-Null
          Copy-Item 'build/${{ matrix.product }}_artefacts/Release/VST3/${{ matrix.product }}.vst3' staging -Recurse
          Copy-Item validation staging -Recurse
          Copy-Item 'DreamMaster/SUNO-PRESETS.md' staging/INSTALL.md
          Copy-Item 'DreamMaster/SUNO-PRESETS.md' staging/README.md
          "Product: ${{ matrix.product }} ${{ matrix.version }}`nCommit: ${{ github.sha }}`nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" | Set-Content staging/BUILD.txt
          Get-FileHash 'staging/${{ matrix.product }}.vst3/Contents/x86_64-win/${{ matrix.product }}.vst3' | Format-List | Out-File staging/SHA256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.product }}-${{ matrix.version }}-Windows-x64-VST3
          path: staging/
          if-no-files-found: error
      - name: Archive editable source
        run: Compress-Archive -Path DreamMaster,Artwork,.github -DestinationPath DreamMaster-0.2.1-source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DreamMaster-0.2.1-source
          path: DreamMaster-0.2.1-source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.product }}-graphics-validation
          path: validation/
          if-no-files-found: warn
