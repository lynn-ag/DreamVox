name: Build DreamMaster VST3
on:
  push:
    branches: ['main', 'codex/dreammaster-suno-presets']
    paths: ['DreamMaster/**', '.github/workflows/build-dreammaster.yml']
  pull_request:
    paths: ['DreamMaster/**', '.github/workflows/build-dreammaster.yml']
  workflow_dispatch:
concurrency:
  group: dm-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-master:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare artwork
        run: python Artwork/prepare-artwork.py
      - name: Configure
        run: cmake -S DreamMaster -B master-build -G "Visual Studio 17 2022" -A x64
      - name: Build plugin and DSP tests
        run: cmake --build master-build --config Release --target DreamMaster_VST3 DreamMasterTests DreamMasterMeterTests DreamMasterSpectrumTests DreamMasterProfileTests DreamMasterMatchTests DreamMasterRender DreamMasterAnalyze DreamMasterProfile DreamMasterMatch DreamMasterPreview --parallel 2
      - name: DSP regression tests
        run: |
          New-Item -ItemType Directory -Path validation -Force | Out-Null
          & ./master-build/Release/DreamMasterTests.exe 2>&1 | Tee-Object validation/dsp-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'DSP regression tests failed' }
          & ./master-build/Release/DreamMasterMeterTests.exe 2>&1 | Tee-Object validation/meter-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'Loudness / true-peak tests failed' }
          & ./master-build/Release/DreamMasterSpectrumTests.exe 2>&1 | Tee-Object validation/spectral-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'Spectral reference tests failed' }
          & ./master-build/Release/DreamMasterProfileTests.exe 2>&1 | Tee-Object validation/profile-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'Robust Sonic DNA statistics tests failed' }
          & ./master-build/Release/DreamMasterMatchTests.exe 2>&1 | Tee-Object validation/match-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'Reference-match unit tests failed' }
          $script = @'
          import math, struct, wave
          for filename, freq, amp in [('validation/analyzer-test.wav', 440, 5000), ('validation/analyzer-test-two.wav', 880, 6500)]:
              with wave.open(filename, 'wb') as w:
                  w.setnchannels(2)
                  w.setsampwidth(2)
                  w.setframerate(48000)
                  values = (struct.pack('<hh', int(amp*math.sin(2*math.pi*freq*i/48000)), int(amp*math.sin(2*math.pi*freq*i/48000))) for i in range(48000))
                  w.writeframes(b''.join(values))
          '@
          $script | python -
          & ./master-build/DreamMasterAnalyze_artefacts/Release/DreamMasterAnalyze.exe validation/analyzer-test.wav | Tee-Object validation/analyzer.json
          if ($LASTEXITCODE -ne 0) { throw 'Reference analyzer smoke test failed' }
          $analysis = Get-Content validation/analyzer.json -Raw | ConvertFrom-Json
          if ($analysis.schema -ne 'dreammaster.analysis.v1' -or $analysis.channels -ne 2 -or $analysis.spectral_valid -ne $true -or $analysis.spectral_bands_db.Count -ne 9 -or $analysis.integrated_lufs -gt -15 -or $analysis.integrated_lufs -lt -30) { throw 'Invalid reference analysis JSON' }
          & ./master-build/DreamMasterAnalyze_artefacts/Release/DreamMasterAnalyze.exe validation/analyzer-test-two.wav | Tee-Object validation/analyzer-second.json
          if ($LASTEXITCODE -ne 0) { throw 'Second reference analyzer smoke test failed' }
          $analysis2 = Get-Content validation/analyzer-second.json -Raw | ConvertFrom-Json
          if ($analysis2.schema -ne 'dreammaster.analysis.v1' -or $analysis2.spectral_valid -ne $true) { throw 'Invalid second analysis' }
          if ($analysis.spectral_bands_db[3] -le ($analysis.spectral_bands_db[4]+5) -or $analysis2.spectral_bands_db[4] -le ($analysis2.spectral_bands_db[3]+5)) { throw 'Spectral signatures failed to distinguish 440Hz and 880Hz reference tones' }
          & ./master-build/DreamMasterProfile_artefacts/Release/DreamMasterProfile.exe validation/analyzer.json validation/analyzer-second.json 2>&1 | Tee-Object validation/sonic-dna.json
          if ($LASTEXITCODE -ne 0) { throw 'Sonic DNA reference profile smoke test failed' }
          $profile = Get-Content validation/sonic-dna.json -Raw | ConvertFrom-Json
          if ($profile.schema -ne 'dreammaster.sonic-dna.v1' -or $profile.reference_count -ne 2 -or $profile.tonal_median_db.Count -ne 9) { throw 'Invalid personal sound profile JSON' }
          & ./master-build/DreamMasterMatch_artefacts/Release/DreamMasterMatch.exe validation/sonic-dna.json validation/analyzer.json 2>&1 | Tee-Object validation/sonic-match.json
          if ($LASTEXITCODE -ne 0) { throw 'Sonic DNA reference comparison failed' }
          $match = Get-Content validation/sonic-match.json -Raw | ConvertFrom-Json
          if ($match.schema -ne 'dreammaster.match-advisory.v1' -or $match.conservative_tonal_hint_db.Count -ne 9 -or $match.comparable_band_count -lt 1) { throw 'Invalid reference comparison JSON' }
          foreach ($value in $match.conservative_tonal_hint_db) {
            if ($null -ne $value -and [math]::Abs($value) -gt 1.50001) { throw 'Unsafe reference hint' }
          }
          & ./master-build/DreamMasterPreview_artefacts/Release/DreamMasterPreview.exe validation/DreamMaster-preview.png
          if ($LASTEXITCODE -ne 0) { throw 'Editor snapshot failed' }
      - name: Validate VST3 and editor
        run: |
          Invoke-WebRequest 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip' -OutFile pluginval.zip
          if ((Get-FileHash pluginval.zip -Algorithm SHA256).Hash -ne 'C08E61CE3B96DB41636F8EC7E76F4C7E2C13EBDAC7FA1B5A1F52B4F32EC715AB') { throw 'pluginval checksum mismatch' }
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $exe = (Get-ChildItem pluginval -Filter pluginval.exe -Recurse | Select-Object -First 1).FullName
          $bundle = (Resolve-Path 'master-build/DreamMaster_artefacts/Release/VST3/DreamMaster.vst3').Path
          & $exe --strictness-level 5 --repeat 3 --random-seed 12345 --timeout-ms 60000 --validate $bundle 2>&1 | Tee-Object validation/pluginval.txt
          if ($LASTEXITCODE -ne 0) { throw 'pluginval failed' }
          $log = Get-Content validation/pluginval.txt -Raw
          if ([regex]::Matches($log, '(?m)^Completed tests in pluginval / Editor\r?$').Count -ne 3 -or $log -notmatch '(?m)^SUCCESS\r?$') { throw 'Missing completed editor tests or SUCCESS' }
      - name: Package
        run: |
          New-Item -ItemType Directory -Path staging,tools -Force | Out-Null
          Copy-Item master-build/DreamMaster_artefacts/Release/VST3/DreamMaster.vst3 staging -Recurse
          Copy-Item DreamMaster/INSTALL.txt,DreamMaster/README.md staging
          Copy-Item validation staging -Recurse
          "Source: ${{ github.sha }}`nBuild: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" | Set-Content staging/BUILD.txt
          Get-FileHash staging/DreamMaster.vst3/Contents/x86_64-win/DreamMaster.vst3 | Format-List | Out-File staging/SHA256.txt
          Copy-Item master-build/Release/DreamMasterRender.exe,master-build/Release/DreamMasterTests.exe,master-build/Release/DreamMasterMeterTests.exe,master-build/DreamMasterAnalyze_artefacts/Release/DreamMasterAnalyze.exe tools
          Copy-Item DreamMaster/Tools/Analyze-Reference.bat tools
          Copy-Item DreamMaster/Tools/Create-Sonic-DNA.bat tools
          Copy-Item DreamMaster/Tools/Compare-Sonic-DNA.bat tools
          Copy-Item master-build/DreamMasterMatch_artefacts/Release/DreamMasterMatch.exe,master-build/Release/DreamMasterMatchTests.exe tools
          Copy-Item master-build/DreamMasterProfile_artefacts/Release/DreamMasterProfile.exe,master-build/Release/DreamMasterProfileTests.exe tools
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DreamMaster-Windows-x64-VST3
          path: staging/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DreamMaster-test-tools
          path: tools/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DreamMaster-validation
          path: validation/
          if-no-files-found: warn
