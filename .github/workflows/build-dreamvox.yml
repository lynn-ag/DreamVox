name: Build DreamVox VST3

on:
  push:
    paths: ['DreamVox-v0.1/**', 'Artwork/**', '.github/workflows/build-dreamvox.yml']
  pull_request:
    paths: ['DreamVox-v0.1/**', 'Artwork/**', '.github/workflows/build-dreamvox.yml']
  workflow_dispatch:

concurrency:
  group: dreamvox-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-vst3:
    name: Windows x64 Release
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare artwork
        run: python Artwork/prepare-artwork.py

      - name: Configure DreamVox
        run: >-
          cmake -S DreamVox-v0.1/DreamVox -B build
          -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target DreamVox_VST3 --parallel 2

      - name: Prepare downloadable plug-in
        run: |
          $bundle = 'build/DreamVox_artefacts/Release/VST3/DreamVox.vst3'
          $binary = Join-Path $bundle 'Contents/x86_64-win/DreamVox.vst3'
          if (!(Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "The built VST3 binary was not found at $binary"
          }
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          Copy-Item -LiteralPath $bundle -Destination staging -Recurse
          Copy-Item -LiteralPath 'DreamVox-v0.1/DreamVox/INSTALL.txt' -Destination staging

      - name: Upload Windows VST3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DreamVox-Windows-VST3
          path: staging/
          if-no-files-found: error
          retention-days: 30
