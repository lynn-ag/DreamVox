name: Build DreamVox VST3

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-vst3:
    name: Windows x64 Release
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure DreamVox
        run: >-
          cmake -S DreamVox-v0.1/DreamVox -B build
          -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target DreamVox_VST3 --parallel 2

      - name: Validate VST3 including editor lifecycle
        run: ./.github/scripts/validate-windows.ps1

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DreamVox-Windows-validation
          path: validation/
          if-no-files-found: warn

      - name: Prepare downloadable plug-in
        run: |
          $bundle = 'build/DreamVox_artefacts/Release/VST3/DreamVox.vst3'
          $binary = Join-Path $bundle 'Contents/x86_64-win/DreamVox.vst3'
          if (!(Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "The built VST3 binary was not found at $binary"
          }
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          Copy-Item -LiteralPath $bundle -Destination staging -Recurse
          Copy-Item -LiteralPath 'DreamVox-v0.1/DreamVox/INSTALL.txt' -Destination staging
          Copy-Item -LiteralPath validation -Destination staging -Recurse
          "Source commit: ${{ github.sha }}`nBuild: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" | Set-Content staging/BUILD.txt
          Get-FileHash -LiteralPath $binary -Algorithm SHA256 | Format-List | Out-File staging/SHA256.txt

      - name: Upload Windows VST3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DreamVox-Windows-VST3
          path: staging/
          if-no-files-found: error
          retention-days: 30

  reproduce-original-crash:
    name: Reproduce original v0.1.0 editor crash
    # Keep the original regression proof on the repair branch only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/editor-construction-crash'
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restore original source while retaining validation script
        run: |
          git fetch origin 5c291973777f591f6751b2d6cd1b161381a0d637
          git checkout 5c291973777f591f6751b2d6cd1b161381a0d637 -- DreamVox-v0.1/DreamVox
      - name: Configure original
        run: cmake -S DreamVox-v0.1/DreamVox -B build -G "Visual Studio 17 2022" -A x64
      - name: Build original
        run: cmake --build build --config Release --target DreamVox_VST3 --parallel 2
      - name: Confirm original Editor access violation
        run: ./.github/scripts/validate-windows.ps1 -ExpectEditorCrash
      - name: Upload original crash evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DreamVox-v0.1.0-crash-evidence
          path: validation/
          if-no-files-found: warn
